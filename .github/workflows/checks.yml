name: Checks

on:
  push:
    branches: [dev, staging, main]
  workflow_dispatch:

jobs:
  html:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # _header.html and _footer.html are fragments that get pasted into pages.
      # They have no doctype or body of their own, so the validator would fail
      # them every time.
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@master
        with:
          root: .
          blacklist: node_modules .github _head.html _header.html _footer.html

  links:
    name: Broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # fail is false until the pages actually exist. Right now the header links
      # to about.html, blog.html and the rest, none of which are built, so this
      # would fail on every push for weeks. It still reports, so you can read
      # the summary and spot a genuinely wrong path.
      # TURN fail BACK TO true once the page set is built.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude wa.me
            --exclude instagram.com
            --exclude x.com
            './index.html'
            './blog.html'
            './blog-post.html'
            './resources.html'
            './events.html'
            './event.html'
          fail: false

  lighthouse:
    name: Performance and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Serve the site
        run: npx --yes serve -l 8080 . &

      - name: Wait for the server
        run: npx --yes wait-on http://localhost:8080/index.html

      # URLs are listed explicitly so Lighthouse does not try to load the
      # header and footer fragments as if they were pages. Add each new page
      # here as it gets built.
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/index.html
            http://localhost:8080/blog.html
            http://localhost:8080/resources.html
            http://localhost:8080/events.html
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
