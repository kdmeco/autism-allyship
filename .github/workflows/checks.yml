name: Checks

on:
  push:
    branches: [dev, staging, main]
  workflow_dispatch:

jobs:
  html:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # _header.html and _footer.html are fragments that get pasted into pages.
      # They have no doctype or body of their own, so the validator would fail
      # them every time.
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@master
        with:
          root: .
          blacklist: node_modules .github _head.html _header.html _footer.html

  links:
    name: Broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Every public page is listed. Add each new page here as it is built, or
      # its links go unchecked. Fragments are left out because the shell blocks
      # are pasted into these pages already, and admin pages sit behind auth.
      #
      # The excluded hosts either rate-limit automated checks or are preconnect
      # hints whose bare origin returns 404, which is expected and not a broken
      # link. Everything else must resolve, so a wrong path fails the build.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude wa.me
            --exclude instagram.com
            --exclude x.com
            --exclude chat.whatsapp.com
            --exclude gstatic.com
            --exclude firestore.googleapis.com
            './index.html'
            './about.html'
            './accessibility.html'
            './blog.html'
            './blog-post.html'
            './contact.html'
            './donate.html'
            './event.html'
            './events.html'
            './gallery.html'
            './paia.html'
            './privacy.html'
            './resources.html'
            './shop.html'
            './terms.html'
            './ticket.html'
            './404.html'
          fail: true

  lighthouse:
    name: Performance and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Serve the site
        run: npx --yes serve -l 8080 . &

      - name: Wait for the server
        run: npx --yes wait-on http://localhost:8080/index.html

      # URLs are listed explicitly so Lighthouse does not try to load the
      # header and footer fragments as if they were pages. Add each new page
      # here as it gets built. blog-post, event and ticket are left out: they
      # need a record id in the query string to render anything real.
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/index.html
            http://localhost:8080/about.html
            http://localhost:8080/accessibility.html
            http://localhost:8080/blog.html
            http://localhost:8080/contact.html
            http://localhost:8080/donate.html
            http://localhost:8080/events.html
            http://localhost:8080/gallery.html
            http://localhost:8080/paia.html
            http://localhost:8080/privacy.html
            http://localhost:8080/resources.html
            http://localhost:8080/shop.html
            http://localhost:8080/terms.html
            http://localhost:8080/404.html
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
