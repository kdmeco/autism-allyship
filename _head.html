<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta
  name="theme-color"
  content="#FBFAFA"
  media="(prefers-color-scheme: light)"
/>
<meta
  name="theme-color"
  content="#141213"
  media="(prefers-color-scheme: dark)"
/>

<link
  rel="preload"
  href="assets/fonts/poppins-400.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>
<link
  rel="preload"
  href="assets/fonts/poppins-600.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>

<link rel="stylesheet" href="styles.css" />

<script src="translations.js" defer></script>
<script src="main.js" defer></script>

<script>
  // Resolves the saved settings before the browser paints anything, so a
  // returning visitor never sees a flash of the wrong theme or text size.
  // Deliberately inline and tiny. If you change a storage key here, change it
  // in main.js too.
  (function () {
    var root = document.documentElement;
    var saved = {};

    // CSS only hides the accessibility panel when this class is present. If this
    // script never runs, the panel stays visible and open rather than vanishing.
    root.classList.add("js");

    try {
      saved.theme = localStorage.getItem("aaf-theme");
      saved.textSize = localStorage.getItem("aaf-text-size");
      saved.sensory = localStorage.getItem("aaf-sensory-mode");
      saved.plainText = localStorage.getItem("aaf-plain-text");
      saved.language = localStorage.getItem("aaf-language");
    } catch (error) {
      // Private browsing and pages opened straight off the file system can
      // block storage. Fall back to defaults rather than breaking the page.
    }

    var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute(
      "data-theme",
      saved.theme || (prefersDark ? "dark" : "light"),
    );
    root.setAttribute("data-text-size", saved.textSize || "1");

    if (saved.sensory === "on") {
      root.classList.add("sensory-mode");
    }

    if (saved.plainText === "on") {
      root.classList.add("plain-text");
    }

    if (saved.language) {
      root.setAttribute("lang", saved.language);
    }
  })();
</script>
